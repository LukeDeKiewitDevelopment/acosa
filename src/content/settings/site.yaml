directoryCopy:
  businessNodes:
    title: Business Nodes | ACOSA
    description: Find accommodation by location across South Africa's key business nodes.
    heroHeading: Where do you need to do business?
    heroBody: >-
      Start with where you need to be. ACOSA brings together carefully selected
      accommodation around key South African business areas, helping you find
      options relevant to your destination rather than searching through
      hundreds of unrelated stays.
    heroEyebrow: FIND ACCOMMODATION BY LOCATION
    heroImage: ../../assets/images/pages/business-nodes/hero.png
    primaryCtaLabel: Explore Business Nodes
    primaryCtaLink: "#directory"
    directoryEyebrow: EXPLORE ACOSA'S BUSINESS NODES
    directoryHeading: Find accommodation where you need to do business.
    assistanceEyebrow: HERE TO HELP
    assistanceHeading: Need assistance finding the right area?
    assistanceBody: >-
      Tell us where you need to be and what matters for your stay. ACOSA can
      help you explore suitable accommodation in the network.
    assistanceImage: ../../assets/images/pages/acosa-library/ACOSA_06_Project_Team_Stay.png
  properties:
    title: All Properties | ACOSA
    description: Browse vetted business accommodation properties across South Africa.
    heading: All Properties
    lead: Browse business accommodation across South Africa's key corporate nodes.
    heroEyebrow: ACOSA PROPERTIES
    regionLabel: Gauteng
    searchNavLabel: Search properties
    networkNavLabel: Growing network
    networkEyebrow: GROWING NETWORK
    networkHeading: ACOSA is growing deliberately.
    networkBody: >-
      We're building our accommodation network around quality, not simply
      quantity. New business nodes and carefully selected properties will be
      added as the ACOSA network expands.
    networkImage: ../../assets/images/pages/business-nodes/south-africa-network.png
    networkCtaLabel: Explore Business Nodes
    networkCtaLink: /business-nodes
