hero:
  eyebrow: WELCOME TO ACOSA
  heading: How can we help?
  body: >-
    Whether you're looking for a business stay, arranging accommodation for a team, or exploring a property listing, choose the route that fits. We're here to help you take the next step.
  image: ../../assets/images/pages/contact/doorway-background.png

contactRoutes:
  - number: "1"
    title: I need accommodation.
    description: Looking for a business stay for yourself?
    details:
      - Preferred location or business node
      - Check-in and check-out dates
      - Number of guests
      - Essential amenities or requirements

  - number: "2"
    title: I'm booking for a company or team.
    description: Tell us where, when, and for how many travellers.
    details:
      - Company name and preferred location
      - Number of travellers and rooms required
      - Travel dates and length of stay
      - Budget and any special requirements

  - number: "3"
    title: I want to list my property.
    description: Interested in reaching ACOSA's corporate accommodation audience?
    details:
      - Property name and location
      - Accommodation type and number of rooms
      - Website or social media link (if available)
      - Contact name and details
    note: We'll send you the official application form and explain the next steps.
    learnMoreLabel: Learn About Listing with ACOSA
    learnMoreLink: /list-your-property

  - number: "4"
    title: Something else?
    description: For general enquiries.
    details:
      - Brief description of your enquiry
      - Relevant property, location or service (if applicable)
      - Your name and contact details

