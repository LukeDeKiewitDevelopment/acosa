hero:
  eyebrow: CONTACT ACOSA
  heading: How can we help?
  body: >-
    Whether you're looking for business accommodation, arranging a stay for someone else, or interested in joining ACOSA as an accommodation provider, choose the quickest route below.

contactRoutes:
  - number: "1"
    title: I need accommodation.
    description: Looking for a business stay for yourself?
    cta:
      label: WhatsApp ACOSA
      link: whatsapp
      prefilledMessage: "Hi ACOSA, I'm looking for business accommodation in [AREA]."

  - number: "2"
    title: I'm booking for a company or team.
    description: Tell us where, when, and for how many travellers.
    cta:
      label: Email Your Requirements
      link: email
      subject: "Corporate Accommodation Request"

  - number: "3"
    title: I want to list my property.
    description: Interested in reaching ACOSA's corporate accommodation audience?
    primaryCta:
      label: Email a Property Application
      link: email
      subject: "ACOSA Property Listing Application"
    secondaryCta:
      label: WhatsApp ACOSA
      link: whatsapp
      prefilledMessage: "Hi ACOSA, I'm interested in listing my property and would like some more information."

  - number: "4"
    title: Something else?
    description: For general enquiries.
    cta:
      label: Email ACOSA
      link: email
      subject: "General ACOSA Enquiry"

