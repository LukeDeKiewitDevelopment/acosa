hero:
  eyebrow: WHY ACOSA?
  heading: Business accommodation shouldn't be a guessing game.
  body: >-
    A beautiful room doesn't necessarily make a property practical for someone travelling for work. ACOSA looks beyond the photographs to help corporate travellers discover independent accommodation selected with the realities of business travel in mind.
  image: ../../assets/images/pages/hero/image.png
  cta:
    label: Find Accommodation
    link: /business-nodes

experienceSection:
  eyebrow: BUILT FROM HOSPITALITY EXPERIENCE
  heading: More than 20 years of seeing what makes a stay work.
  body: >-
    ACOSA grew from more than two decades of hands-on experience across guesthouses, lodges, hospitality management and consulting.

    Over the years, one pattern became increasingly clear. Many quality independent establishments offered excellent accommodation and genuine hospitality but had limited time or resources to reach the right corporate market.

    At the same time, large accommodation platforms brought every kind of stay together, leaving business travellers and bookers to determine for themselves which properties were genuinely suited to their needs.

    ACOSA was created to make that connection more deliberate. Better-fit accommodation for people travelling for work. More focused corporate visibility for quality independent properties.

curationSection:
  eyebrow: CURATED, NOT CROWDED
  heading: Someone has looked beyond the photographs.
  body: >-
    ACOSA isn't trying to list every accommodation establishment. Properties are reviewed before acceptance, with attention to practical factors that can influence a business stay.
  image: ../../assets/images/pages/founderStrip/image.jpg
  factorsInclude:
    - reliable high-speed WiFi
    - practical workspace
    - secure off-street parking
    - backup power
    - cleanliness
    - breakfast availability
    - room comfort
    - professional and responsive service
    - security
    - practical business usability
  highlightStatement: "Not every property makes the platform."
  note: "ACOSA's detailed internal assessment and scoring methodology remains private. ACOSA's approved qualification process separately assesses mandatory requirements and additional business-usability factors."

approvedSection:
  heading: What does ACOSA Approved mean?
  body: >-
    ACOSA Approved indicates that a property has been reviewed by ACOSA and considered suitable for business travellers according to our accommodation criteria.

    It is a curated suitability designation, not a formal industry certification.

    Approval remains at ACOSA's discretion and may be reconsidered if serious quality or guest-experience concerns arise.
  cta:
    label: Explore ACOSA Properties
    link: /business-nodes

outcomeSection:
  heading: Accommodation that understands why you're travelling.
  body: >-
    The right business stay supports the whole trip — from getting work done and leaving early when necessary to returning somewhere comfortable at the end of the day.
  image: ../../assets/images/pages/heroImage.png
  cta:
    label: Find Your Stay
    link: /business-nodes

seo:
  title: Why ACOSA | Our Story and Standards
  description: >-
    Discover why ACOSA exists: our story, our curation philosophy, and the standards every listed property must meet for business travel excellence.
