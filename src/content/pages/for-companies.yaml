hero:
  eyebrow: CORPORATE ACCOMMODATION
  heading: Finding the right stay shouldn't become another job.
  body: >-
    When you're arranging accommodation for someone else, the responsibility looks different. You need confidence that the location works, the practical requirements are covered, and the person you're sending will be comfortable, secure, and able to get on with the reason they're traveling. ACOSA helps make that search more manageable.
  image: ../../assets/images/pages/corporate-booker/image.jpg
  primaryCta:
    label: Find Accommodation
    link: /business-nodes
  secondaryCta:
    label: Email Your Requirements
    link: email

whoWeHelpSection:
  heading: Built for the people behind the booking.
  body: "ACOSA can help:"
  roles:
    - Executive Assistants
    - HR Teams
    - Procurement Teams
    - Operations Teams
    - Project Coordinators
    - Travel Coordinators
    - Companies placing travelling employees

howAcosaHelpsSection:
  heading: Start with a more relevant shortlist.
  features:
    - title: Search by Business Location
      body: Start where your traveller actually needs to work.
    - title: Compare Practical Information
      body: See relevant facilities, property information and nearby conveniences before making contact.
    - title: Choose from Curated Properties
      body: Properties are reviewed before being accepted onto ACOSA.
    - title: Ask for Help When Necessary
      body: If you have specific requirements, a team stay, or cannot immediately identify the right option, contact ACOSA.

teamsAndProjectsSection:
  heading: Need accommodation for more than one traveller?
  image: ../../assets/images/pages/acosa-library/ACOSA_06_Project_Team_Stay.png
  body: >-
    Arranging accommodation for a project team, travelling employees or colleagues staying for an extended period can involve more than simply finding available rooms. Tell ACOSA where your team needs to be, how many people are travelling and what matters for the stay. We'll help identify suitable options within the ACOSA network where possible.
  requirementsList:
    - "Location: Where does the team need to be based?"
    - "Number of travellers: How many people require accommodation?"
    - "Dates: When will the stay begin and end?"
    - "Length of stay: Is this a short visit or an extended project placement?"
    - "Key requirements: Anything particularly important for the team or assignment?"
  primaryCta:
    label: Email Your Requirements
    link: email
  secondaryCta:
    label: WhatsApp ACOSA
    link: whatsapp

finalCta:
  heading: Tell us what your travellers need.
  body: >-
    Whether you're placing one employee or coordinating accommodation for a project team, we'll help you start with more relevant options.
  primaryCta:
    label: Email ACOSA
    link: email
  secondaryCta:
    label: Find Accommodation
    link: /business-nodes
  whatsappCta:
    label: Prefer WhatsApp? Talk to ACOSA
    link: whatsapp

seo:
  title: Corporate Accommodation | ACOSA
  description: >-
    ACOSA helps executive assistants, HR teams, and travel coordinators find curated business accommodation for employees. Email your requirements for team or individual placements.
